<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dine arrangementer · URC Arrangementsportal</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1626">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/portal.js"></script>
<style>
.head{padding:56px 0 28px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.head h1{font-size:clamp(36px,5vw,56px);margin-top:10px}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.ev{position:relative;display:flex;flex-direction:column;gap:18px;padding:24px;text-decoration:none;color:inherit;overflow:hidden;transition:border-color .15s,transform .15s}
.ev:hover{border-color:var(--line-2);transform:translateY(-2px)}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sage);opacity:.8}
.ev .chips{display:flex;flex-wrap:wrap;gap:8px}
.ev h2{font-size:30px}
.ev .meta{color:var(--muted);font-size:15px;margin-top:6px}
.ev .bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.ev .cd{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:.9}
.ev .cd small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
.ev .go{color:var(--sage);font-weight:600;font-size:14px;white-space:nowrap}
.empty{padding:40px 28px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);margin-bottom:10px;font-size:28px}
#newBox{margin-top:28px;padding:22px}
#newBox h3{margin-bottom:14px}
#newBox[hidden]{display:none}
.hint{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div id="demo"></div>
<header class="top">
  <div class="container">
    <a class="brand" id="brand" href="./"><span id="logo"></span><i></i><span>Arrangementsportal</span></a>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <button class="btn sm" id="out">Logg ut</button>
  </div>
</header>
<main>
  <div class="container">
    <div class="head">
      <div><div class="eyebrow" id="eyebrow">Arrangementer</div><h1>Dine arrangementer</h1></div>
      <button class="btn" id="newBtn" hidden>+ Nytt arrangement</button>
    </div>
    <div class="evs" id="list"></div>

    <form class="card" id="newBox" hidden>
      <h3>Nytt arrangement</h3>
      <div class="form-row">
        <label class="field">Navn<input id="nName" placeholder="Løpernes Mester 2027" required></label>
        <label class="field">Adresse (slug)<input id="nSlug" placeholder="lm27" pattern="[a-z0-9][a-z0-9-]{1,40}" required></label>
        <label class="field">Sted<input id="nVenue" placeholder="Granåsen, Trondheim"></label>
        <label class="field">Dato<input id="nDate" type="date"></label>
      </div>
      <p class="hint" style="margin:10px 0 14px">Adressen blir portal.urcofficial.com/<b id="slugPrev">…</b>. Små bokstaver, tall og bindestrek.</p>
      <div id="nMsg" class="flash err" hidden></div>
      <div style="display:flex;gap:10px;margin-top:12px"><button class="btn primary" type="submit">Opprett</button><button class="btn" type="button" id="nCancel">Avbryt</button></div>
    </form>
  </div>
</main>
<footer class="foot"><div class="container"><span>URC · Ultimate Running Championship</span><span><a href="mailto:urcsportsno@gmail.com">urcsportsno@gmail.com</a></span></div></footer>
<script>
(async function () {
  const P = window.Portal, $ = s => document.querySelector(s);
  $('#logo').innerHTML = P.LOGO; $('#brand').href = P.page('');
  try {
    const user = await P.requireUser();
    $('#demo').innerHTML = P.demoBanner(); P.bindDemo();
    $('#who').textContent = user.email;
    $('#out').onclick = async () => { await P.api.signOut(); location.href = P.page(''); };
    const [events, admin] = await Promise.all([P.api.events(), P.api.isAdmin()]);
    const mine = events.filter(e => e.role);
    if (admin) $('#eyebrow').textContent = 'URC-admin · Alle arrangementer';

    $('#list').innerHTML = mine.length ? mine.map(e => {
      const d = P.daysTo(e.event_date);
      const cd = d === null ? '' : d > 0 ? `<div class="cd num">${d}<small>dager igjen</small></div>` : d === 0 ? `<div class="cd">I dag<small>løpsdag</small></div>` : `<div class="cd" style="font-size:26px">${P.STATUS_LABEL[e.status] || ''}<small>${P.fmtDate(e.event_date)}</small></div>`;
      return `<a class="card ev" href="${P.href(e.slug)}">
        <div class="chips"><span class="chip ${e.role === 'admin' ? 'gold' : 'sage'}">${P.ROLE_LABEL[e.role]}</span><span class="chip plain">${P.STATUS_LABEL[e.status] || e.status}</span></div>
        <div><h2>${P.esc(e.name)}</h2><div class="meta">${P.esc(e.venue || 'Sted ikke satt')} · ${P.fmtDate(e.event_date)}</div></div>
        <div class="bottom">${cd || '<span></span>'}<span class="go">Åpne arrangement →</span></div>
      </a>`;
    }).join('') : `<div class="card empty" style="grid-column:1/-1"><h2>Ingen arrangementer ennå</h2><p>Du er logget inn som ${P.esc(user.email)}, men er ikke lagt til i noen arrangementer. Ta kontakt med URC hvis du skal ha tilgang.</p></div>`;

    if (admin) {
      $('#newBtn').hidden = false;
      $('#newBtn').onclick = () => { $('#newBox').hidden = false; $('#nName').focus(); };
      $('#nCancel').onclick = () => { $('#newBox').hidden = true; };
      const slugify = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/æ/g, 'ae').replace(/ø/g, 'o').replace(/å/g, 'a').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
      let touched = false;
      $('#nSlug').addEventListener('input', () => { touched = true; $('#slugPrev').textContent = $('#nSlug').value || '…'; });
      $('#nName').addEventListener('input', () => { if (!touched) { $('#nSlug').value = slugify($('#nName').value); $('#slugPrev').textContent = $('#nSlug').value || '…'; } });
      $('#newBox').addEventListener('submit', async ev => {
        ev.preventDefault();
        const m = $('#nMsg'); m.hidden = true;
        const row = { name: $('#nName').value.trim(), slug: $('#nSlug').value.trim(), venue: $('#nVenue').value.trim() || null, event_date: $('#nDate').value || null };
        const reserved = ['assets', 'verktoy', 'logg-inn', 'arrangementer', 'arrangement', 'index', 'supabase'];
        if (!row.name || !/^[a-z0-9][a-z0-9-]{1,40}$/.test(row.slug) || reserved.includes(row.slug)) { m.textContent = 'Fyll inn navn og en gyldig adresse.'; m.hidden = false; return; }
        try { await P.api.createEvent(row); location.href = P.href(row.slug); }
        catch (e) { m.textContent = /duplicate|unique/i.test(e.message) ? 'Adressen er allerede i bruk.' : 'Kunne ikke opprette: ' + e.message; m.hidden = false; }
      });
    }
    P.ready();
  } catch (e) { console.error(e); P.message('Noe gikk galt', P.esc(e.message || e), { href: P.page(''), label: 'Til forsiden' }); }
})();
</script>
</body>
</html>
